services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - app-network
    depends_on:
      - user-service
      - order-service

  user-service:
    image: my-user-api
    networks:
      - app-network
    depends_on:
      - db

  order-service:
    image: my-order-api
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: postgres:15
    networks:
      - app-network

networks:
  app-network:
    driver: bridge